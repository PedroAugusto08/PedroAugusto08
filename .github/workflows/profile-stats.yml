name: Atualizar estatísticas do perfil

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Gerar estatísticas
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: stats
          options: username=PedroAugusto08&show_icons=true&theme=tokyonight
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Gerar linguagens
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: top-langs
          options: username=PedroAugusto08&layout=compact&theme=tokyonight
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Salvar cartões
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza cartões de estatísticas"
            git push
          fi
